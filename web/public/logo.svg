<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128" role="img" aria-label="Pawnix logo">
  <style>
    /* Default (dark mode): deep navy panel with mint cyan signal */
    .panel { fill: #0B1120; }
    .signal { stroke: #5EEAD4; fill: #5EEAD4; }

    /* Light mode: warm white panel with deep teal signal */
    @media (prefers-color-scheme: light) {
      .panel  { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .signal { stroke: #0d9488; fill: #0d9488; }
    }
  </style>
  <rect class="panel" width="100" height="100" rx="22"/>
  <circle class="signal" cx="50" cy="50" r="32" fill="none" stroke-width="5"/>
  <path class="signal" d="M 38 34 Q 50 26 62 34" fill="none" stroke-width="5" stroke-linecap="round"/>
  <path class="signal" d="M 30 48 Q 50 38 70 48" fill="none" stroke-width="5" stroke-linecap="round"/>
  <circle class="signal" cx="50" cy="60" r="6"/>
</svg>
