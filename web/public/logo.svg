<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pawnix logo">
  <!-- Outer kernel ring: dashed orbit, suggests OS kernel encircling the agent core -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 2.5" opacity="0.55"/>

  <!-- Inner kernel ring: solid, slightly thicker -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.35"/>

  <!-- Core: dark graphite disc, the "agent kernel" -->
  <circle cx="32" cy="32" r="23" fill="#1a1a1a"/>

  <!-- Paw print: 1 large palm pad + 4 toe beans -->
  <!-- Palm pad: rounded triangular shape, drawn as a path for organic feel -->
  <path d="M32 28
           C 26 28, 22.5 32.5, 23 38
           C 23.4 42.5, 27 45.5, 32 45.5
           C 37 45.5, 40.6 42.5, 41 38
           C 41.5 32.5, 38 28, 32 28 Z"
        fill="#f59e0b"/>

  <!-- Toe beans: 4 ellipses arranged in an arc above the palm -->
  <ellipse cx="20.5" cy="27" rx="3.2" ry="4.2" fill="#f59e0b" transform="rotate(-22 20.5 27)"/>
  <ellipse cx="27"   cy="20" rx="2.8" ry="3.8" fill="#f59e0b" transform="rotate(-8 27 20)"/>
  <ellipse cx="37"   cy="20" rx="2.8" ry="3.8" fill="#f59e0b" transform="rotate(8 37 20)"/>
  <ellipse cx="43.5" cy="27" rx="3.2" ry="4.2" fill="#f59e0b" transform="rotate(22 43.5 27)"/>
</svg>
