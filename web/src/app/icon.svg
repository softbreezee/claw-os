<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Hard-coded fills/strokes only — Chrome's favicon renderer
       does not honour <style> + @media (prefers-color-scheme).
       Deep-navy panel + mint cyan reads cleanly against any
       browser tab background. -->
  <rect width="100" height="100" rx="22" fill="#0B1120"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="#5EEAD4" stroke-width="5"/>
  <path d="M 38 34 Q 50 26 62 34" fill="none" stroke="#5EEAD4" stroke-width="5" stroke-linecap="round"/>
  <path d="M 30 48 Q 50 38 70 48" fill="none" stroke="#5EEAD4" stroke-width="5" stroke-linecap="round"/>
  <circle cx="50" cy="60" r="6" fill="#5EEAD4"/>
</svg>
